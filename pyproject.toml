[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "graymul"
version = "0.1.0"
description = "Fast integer multiplication (schoolbook, Karatsuba, Toom-Cook, NTT, Harvey-van der Hoeven) with Python bindings"
license = { text = "MIT" }
authors = [{ name = "GrayMUL contributors" }]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Repository = "https://github.com/jake1104/GrayMUL"

[tool.maturin]
manifest-path = "crates/graymul-py/Cargo.toml"
module-name = "graymul._graymul"
python-source = "python"
features = ["pyo3/extension-module"]
